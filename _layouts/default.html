<!DOCTYPE html>
<html>

<head>
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

  {% include meta.html %}

  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
  <link rel="alternate" type="application/rss+xml"
        title="{{ site.name }} - {{ site.description }}"
        href="{{ site.baseurl }}/feed.xml" />
</head>

<body>

  <!-- Full-width banner -->
  <header
    style="
      width:100vw;
      margin-left:calc(-50vw + 50%);
      margin-right:calc(-50vw + 50%);
      height:400px;
      background-image:url('{{ site.baseurl }}/images/DSC_2901.jpg');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    ">

    <div style="
      background:rgba(0,0,0,.35);
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    ">
      <h1 style="
        color:white;
        font-size:3rem;
        margin:0;
        text-shadow:2px 2px 10px rgba(0,0,0,.6);
      ">
        Tewahade Online Notebook
      </h1>
    </div>

  </header>

  <!-- Navigation area -->
  <div style="width:75%; max-width:1500px; margin:0 auto;">

    <header class="masthead clearfix">
      
      <nav>
        <a href="{{ site.baseurl }}/">Notebook</a>
        <a href="#">Website</a>
        <a href="{{ site.baseurl }}/about">About & CV</a>
      </nav>

    </header>

    <div style="margin-top:15px; text-align:center;">
      Browse by
      <a href="{{ site.url }}{{ site.baseurl }}/categoryview">Category</a>
      |
      <a href="{{ site.url }}{{ site.baseurl }}/monthview">Date</a>
      |
      <a href="{{ site.url }}{{ site.baseurl }}/tagview">Tag</a>
    </div>

    <div style="text-align:right; margin-top:10px;">
      <a href="https://github.com/leilatewahade/Tewahade_LabNotebook">
        Admin
      </a>
    </div>

  </div>

  <!-- Main page content -->
  <div id="main"
       role="main"
       style="width:75%; max-width:1500px; margin:30px auto;">
    {{ content }}
  </div>

  <!-- Footer -->
  <div class="wrapper-footer">
    <div style="width:95%; max-width:1500px; margin:0 auto;">
      <footer class="footer">
        {% include svg-icons.html %}
      </footer>
    </div>
  </div>

  {% include analytics.html %}

</body>
</html>
