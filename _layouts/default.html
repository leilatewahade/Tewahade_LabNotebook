```html
<!DOCTYPE html>
<html>

<head>
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

  {% include meta.html %}

  <!--[if lt IE 9]>
    <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
  <![endif]-->

  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
  <link rel="alternate" type="application/rss+xml"
        title="{{ site.name }} - {{ site.description }}"
        href="{{ site.baseurl }}/feed.xml" />
</head>

<body>

  <!-- Banner -->
  <header
    style="
      background-image:url('{{ site.baseurl }}/images/DSC_2901.jpg');
      background-size:cover;
      background-position:center;
      height:400px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    ">

    <div style="
      background:rgba(0,0,0,.35);
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    ">

      <h1 style="
        color:white;
        font-size:3rem;
        margin:0;
        text-shadow:2px 2px 10px rgba(0,0,0,.6);
      ">
        Tewahade Online Notebook
      </h1>

    </div>
  </header>

  <!-- Navigation -->
  <div class="wrapper-masthead">
    <div class="container">

      <header class="masthead clearfix">

        <a href="{{ site.baseurl }}/" class="site-avatar">
          <img src="{{ site.avatar }}" />
        </a>

        <nav>
          <a href="{{ site.baseurl }}/">Notebook</a>
          <a href="#">Website</a>
          <a href="{{ site.baseurl }}/about">About & CV</a>
        </nav>

      </header>

      <div style="margin-top:15px; text-align:center;">
        Browse by
        <a href="{{ site.url }}{{ site.baseurl }}/categoryview">Category</a>
        |
        <a href="{{ site.url }}{{ site.baseurl }}/monthview">Date</a>
        |
        <a href="{{ site.url }}{{ site.baseurl }}/tagview">Tag</a>
      </div>

      <div style="text-align:right; margin-top:10px;">
        <a href="https://github.com/leilatewahade/Tewahade_LabNotebook">
          Admin
        </a>
      </div>

    </div>
  </div>

  <div id="main" role="main" class="container">
    {{ content }}
  </div>

  <div class="wrapper-footer">
    <div class="container">
      <footer class="footer">
        {% include svg-icons.html %}
      </footer>
    </div>
  </div>

  {% include analytics.html %}

</body>
</html>
```
